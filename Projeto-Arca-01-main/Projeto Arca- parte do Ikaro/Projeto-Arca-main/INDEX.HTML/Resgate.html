<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitação de Resgate</title>

<style>
    body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f6fb;
}


.topo {
    background: #3f4c8b;
    color: white;
    padding: 15px 40px;
    display: flex;
    justify-content: space-between;
}


.conteudo {
    max-width: 1000px;
    margin: 40px auto;
}


.cabecalho {
    margin-bottom: 20px;
}

.breadcrumb {
    color: #6c757d;
    font-size: 14px;
}

.cabecalho h1 {
    margin: 5px 0;
    color: #2c3e70;
}

.cabecalho p {
    color: #6c757d;
}


.card {
    background: white;
    border-radius: 10px;
    padding: 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}


.titulo-da-secao {
    color: #2c3e70;
    font-weight: bold;
    margin-bottom: 15px;
}


.grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
}


input, textarea {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
}


textarea {
    height: 90px;
}


.map {
    height: 220px;
    border-radius: 8px;
    background: #dfe3ea;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
    font-size: 14px;
}


.upload {
    border: 2px dashed #ccc;
    padding: 25px;
    text-align: center;
    color: #777;
    border-radius: 8px;
}


.botoes {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
}

.bt-cancelar {
    border: 1px solid #3f4c8b;
    background: white;
    padding: 10px 25px;
    border-radius: 6px;
    cursor: pointer;
}

.bt-confirmar {
    background: #3f4c8b;
    color: white;
    border: none;
    padding: 10px 30px;
    border-radius: 6px;
    cursor: pointer;
}


.hidden-label {
    display: none;
}
</style>
</head>

<body>

<div class="topo">
    <div>Programa ARCA</div>
    <div>Início &nbsp;&nbsp; Perfil &nbsp;&nbsp; Ajuda</div>
</div>

<div class="conteudo">

    <div class="cabecalho">
        <div class="breadcrumb">SERVIÇOS / RESGATE</div>
        <h1>Solicitação de Resgate</h1>
        <p>Solicite o resgate de um animal em situação de risco</p>
    </div>

    <div class="card">

        <div class="titulo-da-secao">Informações do Resgate</div>

       
        <label class="hidden-label">SISTEMA WEB</label>

        <div class="grid">

            <textarea placeholder="Descreva a situação do animal..."></textarea>

            <input type="text" placeholder="Endereço completo ou referência">

            <div class="map" >
                   <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d12594.796413486143!2d-40.27079796092201!3d-20.19838958248505!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xb81ff105549a61%3A0x409c2919913258a7!2sSerra%20-%20ES!5e0!3m2!1spt-PT!2sbr!4v1778539314386!5m2!1spt-PT!2sbr" width="1000" height="200" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>

            <div class="upload">
               <input type="file" id="arquivo" name="arquivo" > 
            </div>

        </div>

        <div class="botoes">
            <button class="bt-cancelar">Cancelar</button>
            <button class="bt-confirmar">Enviar Solicitação</button>
        </div>

    </div>

</div>

</body>
</html>
